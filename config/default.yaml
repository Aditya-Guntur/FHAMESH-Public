system:
  name: "fhamesh"
  log_level: "INFO"

redis:
  url: "redis://localhost:6379"
  session_ttl_seconds: 60

security:
  token_ttl_seconds: 30
  max_hops: 10
  signing_keys:
    leaf: "change_me_leaf_key_at_least_32_bytes!"
    orchestrator: "change_me_orch_key_at_least_32_bytes!"
    datacore: "change_me_core_key_at_least_32_bytes!"

leaf:
  sanitizer:
    max_length: 2000
  classifier:
    min_confidence: 0.3
  eligibility:
    min_confidence: 0.3

orchestrator:
  validation:
    max_subtree_depth: 5
  uncertainty:
    rejection_threshold: 0.2
    adversarial_threshold: 0.8
  subtree:
    timeout_seconds: 30.0

datacore:
  db_path: "data.db"
  query_validation:
    require_justification: true
    allowed_tables:
      - employees
      - products
      - orders

audit:
  db_path: "audit.db"
