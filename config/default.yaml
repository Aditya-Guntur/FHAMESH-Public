system:
  name: "fhamesh"
  log_level: "INFO"

redis:
  url: "redis://localhost:6379"
  session_ttl_seconds: 60

security:
  token_ttl_seconds: 30
  max_hops: 10
  signing_keys:
    leaf: "change_me_leaf_key_at_least_32_bytes!"
    orchestrator: "change_me_orch_key_at_least_32_bytes!"
    datacore: "change_me_core_key_at_least_32_bytes!"

leaf:
  sanitizer:
    max_length: 2000
  classifier:
    min_confidence: 0.3
    backend: "auto"   # auto | langgraph | regex
  eligibility:
    min_confidence: 0.3

orchestrator:
  validation:
    max_subtree_depth: 5
  uncertainty:
    rejection_threshold: 0.2
    adversarial_threshold: 0.8
  subtree:
    timeout_seconds: 30.0
  decomposition:
    backend: "auto"   # auto | langgraph | rules
  aggregation:
    backend: "auto"   # auto | langgraph | merge

# Shared connection settings for LangGraph-backed reasoning agents.
# "auto" backends try this first and fall back to the deterministic
# implementation if the model is unreachable.
agents:
  ollama:
    model: "llama3.2"
    base_url: "http://localhost:11434"
    temperature: 0.0
    timeout_seconds: 10.0

datacore:
  db_path: "data.db"
  query_validation:
    require_justification: true
    allowed_tables:
      - employees
      - products
      - orders

audit:
  db_path: "audit.db"
